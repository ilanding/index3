<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Challan Payment</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:10px 18px 18px;
  font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(135deg,#f4f7fb,#e9eef6);
  color:#172033;
}

.card{
  width:100%;
  max-width:450px;
  background:#fff;
  border-radius:20px;
  padding:20px 20px;
  text-align:center;
  box-shadow:0 12px 35px rgba(24,45,78,.12);
}

.logo{
  width:72px;
  height:72px;
  border-radius:50%;
  object-fit:cover;
  display:block;
  margin:0 auto 9px;
}

h1{
  margin:0 0 14px;
  font-size:22px;
}

.steps{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:13px 10px;
  margin-bottom:18px;
}

.step{
  text-align:center;
}

.num{
  width:44px;
  height:44px;
  margin:0 auto 6px;
  border-radius:50%;
  background:#28458f;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:18px;
  font-weight:700;
}

.step h2{
  margin:0 0 3px;
  font-size:14px;
}

.step p{
  margin:0;
  color:#667085;
  font-size:11px;
  line-height:1.3;
}

.btn{
  display:block;
  width:100%;
  padding:13px 16px;
  border-radius:10px;
  background:#1565c0;
  color:#fff;
  text-decoration:none;
  font-size:16px;
  font-weight:700;
  box-shadow:0 5px 14px rgba(21,101,192,.25);
}

.footer{
  margin-top:13px;
  color:#98a2b3;
  font-size:10.5px;
  line-height:1.45;
}
</style>
</head>
